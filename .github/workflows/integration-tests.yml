name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore PortfolioEnterprise.sln

      - name: Build
        run: dotnet build PortfolioEnterprise.sln --no-restore -c Release

      - name: Run integration tests
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --no-build -c Release --filter 'FullyQualifiedName~Integration' --verbosity normal --logger "console;verbosity=detailed"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: '**/TestResults/'
          if-no-files-found: ignore
