name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore PortfolioEnterprise.sln

      - name: Build
        run: dotnet build PortfolioEnterprise.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test PortfolioEnterprise.sln --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/
          if-no-files-found: ignore

      - name: Publish WebAPI
        run: dotnet publish src/WebAPI/WebAPI.csproj -c Release -o ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi-publish
          path: ./publish
          if-no-files-found: error
